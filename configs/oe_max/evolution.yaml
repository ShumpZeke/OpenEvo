# OpenEvolve pointed at the OE-MAX broker.
#
# The engine speaks plain OpenAI protocol to 127.0.0.1:8787 and knows nothing
# about which provider serves a request. Routing, rate limiting, failover and
# retry all happen behind this base_url — which is why upstream needs no changes
# and why swapping a stealth-preview model is a config edit here, not a rewrite.

max_iterations: 24
checkpoint_interval: 6
random_seed: 42

llm:
  # `oe-max-primary` is the broker alias for the REASONER role. It resolves
  # through that role's chain: NVIDIA NIM's flagship reasoner first — the
  # operator's chosen provider, and the only one here probed model-by-model
  # with a real key — then NIM's 120B, then the keyless Zen routes, then
  # everything else discovered.
  #
  # Leading with a key-gated provider is safe because a route whose credential
  # is absent is filtered out rather than attempted: with no NVIDIA_API_KEY the
  # chain falls through to Zen and still serves.
  #
  # The alias stays pointed at the reasoner role so existing runs keep doing
  # what they did and remain comparable with measurements already recorded.
  # Other roles are addressable as `oe-max-coder`, `oe-max-judge` and
  # `oe-max-fast`.
  primary_model: "oe-max-primary"
  primary_model_weight: 1.0
  api_base: "http://127.0.0.1:8787/v1"
  # Local broker token, NOT a provider credential. Upstream keys never leave
  # the broker process.
  api_key: "oe-max-local"
  temperature: 0.8

  # Turn the flagship's hidden reasoning down. Measured 2026-08-29, two ways,
  # and both favour it.
  #
  # Per request, n=3 each through the broker:
  #
  #   default (on)   3/3 applicable   93.4s   10,060 reasoning chars
  #   "low"          3/3              92.2s   10,972
  #   "none"         3/3              69.1s    7,315
  #
  # And a full 30-iteration run on benchmarks/tasks/fn_min_seeded, which is the
  # only reason a comparison like this means anything -- the unseeded task's
  # spread is 0.39, wider than every difference below:
  #
  #   default (on)   32m54s   best 1.4989    6 accepted improvements
  #   "none"         25m40s   best 1.4995   14 accepted improvements
  #
  # 22% quicker, a marginally better score, and more than twice the accepted
  # improvements. Both winners were re-scored independently at spread 0.
  #
  # Note what "none" does NOT do: it does not stop the thinking. Reasoning
  # output fell by about a quarter, not to zero. And the reason this is safe at
  # all is that NIM's flagship keeps reasoning in a separate channel, so it
  # never ate the visible answer -- the failure that made this setting
  # mandatory for local models. Here it is a speed choice, not a correctness
  # one.
  #
  # Evidence limits, stated: one run per arm. The per-request measurement is
  # 3/3 in every arm, which is a ceiling and cannot detect a small regression.
  # Nothing measured points the other way.
  reasoning_effort: "none"

  # Measured, not guessed. A reasoning model can spend its whole budget
  # thinking: one former primary here spent 7,986-7,997 of an 8,000-token
  # budget on hidden reasoning and left nothing for the visible diff — five of
  # eight iterations produced "No valid diffs found" from ~130-second requests.
  # The current routes reason too: nemotron-3-ultra-free spent 39 completion
  # tokens on a two-word answer, and nemotron-3.5-lightning-free truncated at
  # 64/64 tokens all spent reasoning. NIM's ultra keeps its reasoning out of
  # the visible budget, which is the safer shape, but the budget still has to
  # cover reasoning plus output for the rest of the chain.
  # 16,000 leaves ~8,000 for visible output after reasoning. A much
  # larger budget mainly buys latency: OpenEvolve's own client timeout
  # then fires before the response lands, which was observed at 32,000. The broker also
  # detects finish_reason=length and escalates the budget on retry, so this is
  # a sensible default rather than a load-bearing constant.
  max_tokens: 16000
  timeout: 900

  # LLM-as-judge goes to a different route than mutation generation.
  #
  # Upstream already separates these — `evaluator_models` defaults to a copy of
  # `models` — so this needs no engine change, only a name. And the name is the
  # whole point: `oe-max-judge` resolves to a chain led by laguna-s-2.1-free,
  # measured at 859ms with ZERO reasoning tokens, where the reasoner alias took
  # 8,158ms and spent 39 thinking about a two-word answer.
  #
  # Ranking two candidates does not need hidden reasoning. Paying for it here
  # buys latency and truncation risk and nothing else, and truncation in the
  # judge is the expensive kind of failure: it corrupts the *score* rather than
  # the candidate, which is far harder to notice than a broken diff.
  #
  # This is wired but not switched on: `evaluator.use_llm_feedback` is false
  # below, as upstream ships it. Turning it on changes what evolution optimises
  # and would confound every measurement already recorded, so it is a
  # deliberate choice and not a default.
  evaluator_models:
    - name: "oe-max-judge"
      weight: 1.0

prompt:
  system_message: |
    You are an expert algorithm designer improving a function-minimization
    routine. Find the global minimum of
    f(x, y) = sin(x)*cos(y) + sin(x*y) + (x^2 + y^2)/20
    Escape local minima. Return a SEARCH/REPLACE diff.

database:
  population_size: 60
  archive_size: 25
  num_islands: 4
  migration_interval: 6
  migration_rate: 0.1
  feature_dimensions: ["complexity", "diversity"]
  feature_bins: 8

evaluator:
  timeout: 90
  parallel_evaluations: 2
  # Off, as upstream ships it. Set true to enable LLM-as-judge scoring, which
  # then routes through `oe-max-judge` per the evaluator_models block above.
  use_llm_feedback: false

diff_based_evolution: true
max_code_length: 24000
