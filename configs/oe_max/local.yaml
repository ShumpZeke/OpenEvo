# Fully local evolution: the model runs on this machine, nothing leaves it.
#
# Start the broker with OE_MAX_LOCAL_ONLY=1 and it constructs *only* the local
# providers — Ollama, LM Studio, vLLM, llama.cpp. The commercial adapters are
# never built, so no chain entry, no catalogue file and no operator mistake can
# put a request on the wire to a paid endpoint. That is a stronger guarantee
# than "the cloud routes have no key": an absent credential is a filter, and a
# provider that does not exist is not.
#
#   OE_MAX_LOCAL_ONLY=1 ./scripts/start-broker.sh
#   ./scripts/run-evolution.sh --config configs/oe_max/local.yaml
#
# Point a server elsewhere with OE_MAX_OLLAMA_BASE, OE_MAX_LMSTUDIO_BASE,
# OE_MAX_VLLM_BASE or OE_MAX_LLAMACPP_BASE. Model ids are NOT configured
# anywhere: the broker reads them from each server's own /v1/models at startup,
# because what this machine serves is whatever you pulled.

max_iterations: 24
checkpoint_interval: 6
random_seed: 42

llm:
  # The same alias as every other config. It resolves through the reasoner
  # chain, which in local-only mode contains exactly the models your local
  # servers reported — the engine still knows nothing about providers.
  primary_model: "oe-max-primary"
  primary_model_weight: 1.0
  api_base: "http://127.0.0.1:8787/v1"
  # Broker token, not a provider credential. In local-only mode there is no
  # upstream credential at all.
  api_key: "oe-max-local"
  temperature: 0.8

  # Sized from measurement, not from what looks generous.
  #
  # A 27B IQ4_XS model on an RTX 3050 (8 GB) with ~half its layers on the CPU
  # generates at ~3.3 tok/s. At that rate a 4,096-token budget is a TWENTY
  # MINUTE mutation, and a 16,000-token one -- the cloud default -- is over an
  # hour. Neither is a useful iteration.
  #
  # A SEARCH/REPLACE diff is typically 300-600 tokens. 1536 leaves generous
  # headroom for a large one while capping a rambling answer at ~8 minutes.
  # Raise it only if you see diffs actually being cut off; raising it "to be
  # safe" costs wall clock on every single iteration.
  #
  # Do not raise it alone. max_tokens, the provider timeout and the client
  # timeout are one coupled setting (docs/gotchas.md).
  max_tokens: 1536
  # Generous because local generation is slow and that is not a fault. The
  # broker's own provider timeout for local servers is 1800s for the same
  # reason: a short ceiling manufactures timeouts and then blames the model.
  timeout: 1800

  # The judge runs on the same local model. On one machine there is nothing
  # to specialise between, and pointing it elsewhere would mean a second model
  # resident in memory -- which this class of box cannot hold.
  evaluator_models:
    - name: "oe-max-judge"
      weight: 1.0

prompt:
  # The output rules below are not style. Measured against the shorter prompt
  # they replace, six runs each on this model:
  #
  #     shorter prompt   683 tok avg   213 s avg   APPLICABLE 0 of 6
  #     this prompt      491 tok avg   153 s avg   APPLICABLE 6 of 6
  #
  # Better on every axis: 28% fewer tokens, 28% faster, and the only one whose
  # diffs apply at all. The shorter prompt was also far more variable
  # (448-800 tokens against 472-530), which is what a model rambling toward an
  # answer looks like next to one following a format.
  #
  # A diff whose SEARCH block does not match the file is a wasted mutation
  # however fast it arrived, so the metric is applicable diffs per hour, not
  # tokens per second.
  #
  # The line that does the work is the one demanding the SMALLEST unique
  # SEARCH span. Without it the model paraphrases the code it is quoting --
  # which reads correctly and matches nothing.
  system_message: |
    Improve the search algorithm to find the global minimum of
    f(x, y) = sin(x)*cos(y) + sin(x*y) + (x^2 + y^2)/20 and escape local minima.

    OUTPUT RULES - follow exactly:
    - Output ONLY SEARCH/REPLACE blocks. Nothing before, nothing after.
    - No explanation, no preamble, no summary, no commentary on your reasoning.
    - Do not restate the problem or describe what you changed.
    - The SEARCH block must be the SMALLEST span of existing lines that is
      still unique, copied EXACTLY, character for character. Do not paraphrase,
      reformat, or re-indent it.

database:
  # Smaller than the cloud config: a local model produces candidates far more
  # slowly, so a large population spends the whole run being filled rather than
  # being searched.
  population_size: 30
  archive_size: 15
  num_islands: 2
  migration_interval: 6
  migration_rate: 0.1
  feature_dimensions: ["complexity", "diversity"]
  feature_bins: 8

evaluator:
  timeout: 90
  # One at a time by default. Two workers against a single local server queue
  # at the model rather than running in parallel, and on a GPU that is already
  # saturated they compete for the same memory.
  parallel_evaluations: 1
  use_llm_feedback: false

diff_based_evolution: true
max_code_length: 24000
