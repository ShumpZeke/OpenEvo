# ---------------------------------------------------------------------------
# Retired, dead, or misleading. Recorded so nobody spends another afternoon
# rediscovering them. Remove an entry only with evidence it works again.
# ---------------------------------------------------------------------------
retired:

  - name: github_models
    base_url: https://models.github.ai/inference
    finding: >-
      RETIRED. Probed 2026-08-26: HTTP 410 with code
      `github_models_retirement_brownout` — "GitHub Models is temporarily
      unavailable as part of a scheduled retirement brownout." A brownout is
      the rehearsal for a shutdown, so this is not an outage to wait out. It
      was widely recommended as a free endpoint; it is not one.
    verified: "2026-08-26"

  - name: targon
    base_url: https://api.targon.com/v1
    finding: "Probed 2026-08-26: HTTP 410 Gone, empty body."
    verified: "2026-08-26"

  - name: opencode_zen_deepseek_v4_flash_free
    base_url: https://opencode.ai/zen/v1
    finding: >-
      Listed in /models but unserveable: HTTP 400 "Model is unavailable",
      unchanged 2026-08-25 to 2026-08-26. The original evidence that a listing
      is not a working model.
    verified: "2026-08-26"

  - name: opencode_zen_mimo
    base_url: https://opencode.ai/zen/v1
    finding: >-
      `mimo-v2.5-free`: HTTP 429 `FreeUsageLimitError` on every attempt. A
      shared free pool that is empty, not a per-account rate limit — retrying
      does not help. Handled by Outcome.FREE_LIMIT_EXHAUSTED.
    verified: "2026-08-26"

  - name: opencode_zen_muse_spark_contributor
    base_url: https://opencode.ai/zen/v1
    finding: >-
      `muse-spark-1.2-contributor-free`: newly listed, returns HTTP 500
      "Internal server error". The name suggests it is gated to OpenCode
      contributors.
    verified: "2026-08-26"

  - name: nvidia_nim_deepseek_v4_pro
    base_url: https://integrate.api.nvidia.com/v1
    finding: >-
      `deepseek-ai/deepseek-v4-pro` is NOT in NVIDIA's catalogue and appears
      never to have been. This project configured it as its strong fallback,
      so the fallback could not have served a request. NIM's /v1/models is
      public — one unauthenticated GET would have caught it.
    verified: "2026-08-26"

  - name: nvidia_nim_qwen_coder
    base_url: https://integrate.api.nvidia.com/v1
    finding: >-
      `qwen/qwen2.5-coder-32b-instruct` is NOT in NVIDIA's catalogue. NIM hosts
      no Qwen model at all as of 2026-08-26.
    verified: "2026-08-26"
