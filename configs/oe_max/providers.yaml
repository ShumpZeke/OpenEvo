      source: "docs.mistral.ai; not re-fetched this session"
      confidence: documented
    prefer_patterns: ["devstral", "codestral", "mistral-large", "magistral"]
    max_models: 5

  - name: sambanova
    base_url: https://api.sambanova.ai/v1
    api_key_env: SAMBANOVA_API_KEY
    requires_key: true
    public_listing: true
    timeout_s: 120
