# ---------------------------------------------------------------------------
# Provider catalogue.
#
# Adding an OpenAI-compatible provider is an edit here, not a code change.
# Every provider is key-gated, so listing many costs nothing: one without its
# credential is simply not usable and never enters a chain.
#
# HOW MODEL IDS GET HERE: they do not. Entries declare *patterns* of interest,
# and the registry materialises concrete models from each provider's own live
# listing. A pattern is not a claim that a model exists; a remembered id is,
# and this project has now been bitten by remembered ids three times —
# `deepseek-ai/deepseek-v4-pro` and
# `qwen/qwen2.5-coder-32b-instruct` (never in NVIDIA's catalogue at all).
#
# VERIFICATION VOCABULARY, used strictly:
#   verified            we made the call and saw the result, on the date given
#   catalogue-verified  the id came from the provider's live listing, uncalled
#   documented          official docs say so; we did not test it
#   unverified          neither
#
# Endpoint liveness below was probed on 2026-08-26 from this repository. Free
# tiers are DOCUMENTED, not verified: no credential for these providers exists
# here, so no inference call has been made to any of them.
# ---------------------------------------------------------------------------

providers:

  - name: groq
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    requires_key: true
    timeout_s: 120
    liveness: "verified 2026-08-26 — HTTP 401 'Invalid API Key', endpoint alive"
    free_tier:
      status: free_recurring
      note: >-
        Free plan, no credit card. Limits are per model and small; console docs
        show openai/gpt-oss-120b at 30 RPM / 1K RPD / 8K TPM / 200K TPD. Limits
        are per organisation, so extra keys do not raise them.
      source: "console.groq.com/docs/rate-limits (fetched 2026-08-26)"
      confidence: documented
    prefer_patterns: ["gpt-oss", "llama-3.3", "llama-4", "qwen", "kimi", "deepseek"]
    max_models: 6

  - name: cerebras
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    requires_key: true
    timeout_s: 120
    liveness: "verified 2026-08-26 — HTTP 403 'Not authenticated', endpoint alive"
    free_tier:
      status: free_recurring
      note: >-
        Reported as a recurring daily allowance (~1M tokens/day, ~30 RPM) with
        no credit card, resetting at 00:00 UTC, and a free-tier context cap
        around 8K. NOT confirmed against official docs — the pricing URL
        redirects away from the inference docs — so treat the numbers as
        indicative. The 8K context cap is the figure that would matter most
        here and is the least confirmed.
      source: "secondary reports only; official pricing page not confirmed"
      confidence: unverified
    prefer_patterns: ["gpt-oss", "qwen", "llama-4", "llama-3.3"]
    max_models: 5

  - name: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    requires_key: true
    timeout_s: 180
    liveness: "verified 2026-08-26 — endpoint alive, 404 without a credential"
    free_tier:
      status: free_recurring
      note: >-
        Google AI Studio offers a free tier on the Gemini API with per-model
        RPM/RPD limits. Availability varies by region and by model. Free-tier
        prompts may be used to improve Google's products, which is a material
        difference from the other providers here and matters for private code.
      source: "ai.google.dev pricing; not re-fetched this session"
      confidence: documented
    prefer_patterns: ["flash", "pro"]
    max_models: 5

  - name: mistral
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    requires_key: true
    timeout_s: 120
    liveness: "verified 2026-08-26 — HTTP 401 'Invalid API Key', endpoint alive"
    free_tier:
      status: free_recurring
      note: >-
        La Plateforme has an "experiment" free tier requiring phone
        verification. Devstral and Codestral are the relevant models for code
