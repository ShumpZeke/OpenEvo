name: tests

# The upstream suite runs first in every job: a change that breaks it is a
# regression in the fork, not merely a control-plane bug.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the engine and control plane
        run: |
          python -m pip install --upgrade pip
          # [dev] carries pytest -- see bootstrap.sh, which installs the same thing.
          python -m pip install -e ".[dev]"

      - name: Upstream OpenEvolve compatibility suite
        run: |
          pytest tests/ -q -m "not slow" \
            --ignore=tests/evolution --ignore=tests/oe_max --ignore=tests/brain

      - name: Control plane
        run: pytest tests/evolution -q

      - name: OE-MAX (broker, limiter, gates, search)
        run: pytest tests/oe_max -q

      - name: BrainPort (OpenCode brain, worker, plugin contract)
        run: pytest tests/brain -q

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the engine and control plane
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Six upstream tests fail on Windows for platform reasons that live in
      # upstream's own code -- cp1252 YAML decoding, POSIX path assumptions and
      # os.rename semantics. They are enumerated with their causes in
      # docs/testing.md. Fixing them here would mean editing openevolve/, which
      # is what keeps upstream merges fast-forward, so this job covers the fork's
      # own suites and the linux job above is the gate for upstream.
      - name: Control plane
        run: pytest tests/evolution -q

      - name: OE-MAX (broker, limiter, gates, search)
        run: pytest tests/oe_max -q

      - name: BrainPort (OpenCode brain, worker, plugin contract)
        run: pytest tests/brain -q

  web:
    name: web + plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Control Center typecheck
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: OpenCode plugin build
        working-directory: packages/opencode-plugin
        run: |
          npm ci --no-audit --no-fund
          npm run build
