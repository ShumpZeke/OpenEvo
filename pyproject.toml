[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evolution"
description = "Evolution — a production fork of OpenEvolve with a real-time control plane, provider routing, and an isolated agent sandbox."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dynamic = ["version"]

# The engine's own dependencies come first: Evolution is a fork, so the
# upstream package must remain installable and runnable on its own.
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "numpy>=1.22.0",
    "tqdm>=4.64.0",
    "flask",            # classic visualizer, preserved
    "dacite>=1.9.2",
    # control plane
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "psutil>=5.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local scientific backends. Optional on purpose: the fabric detects what is
# installed and reports the rest as unavailable rather than pretending, so a
# minimal install stays usable and a local LLM run does not require any of it.
scientific = [
    "sympy>=1.12",
    "scipy>=1.11",
    "networkx>=3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27",
    "requests>=2.28.0",
    "black>=22.0.0",
    "mypy>=0.950",
]

[project.scripts]
# Upstream CLI, preserved byte-for-byte.
openevolve-run = "openevolve.cli:main"
# Control plane entrypoints.
evolution-server = "control_plane.api.cli:main"
evolution-run = "control_plane.runner.entrypoint:main"
# OE-MAX: provider broker and dashboard.
oe-max-broker = "oe_max.broker.cli:main"
oe-max-dashboard = "oe_max.dashboard:main"
# Alpha Evolve — BrainPort evolution (provider-neutral, OpenCode is the brain)
openevo-brain = "oe_max.brain.evolution:main"
alpha-evolve = "oe_max.brain.evolution:main"
# Project memory: history, resume points and the journal.
evolution-memory = "control_plane.memory.cli:main"

[tool.setuptools]
packages = [
    "openevolve", "openevolve.llm", "openevolve.prompt", "openevolve.utils",
    "control_plane", "control_plane.telemetry", "control_plane.storage",
    "control_plane.api", "control_plane.providers", "control_plane.sandbox",
    "control_plane.runner", "control_plane.analysis", "control_plane.memory",
    "control_plane.scientific", "control_plane.agent", "control_plane.native",
    "oe_max", "oe_max.brain", "oe_max.providers", "oe_max.broker", "oe_max.evaluation",
    "oe_max.execution", "oe_max.search", "oe_max.verification",
]

[tool.setuptools.dynamic]
version = { attr = "openevolve._version.__version__" }

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: end-to-end tests that spawn a real engine subprocess",
]
asyncio_mode = "auto"
